version: '3.8'

services:
  # ====== Database ====== #
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    env_file:
      - ./env/.env.dev
    networks:
      - data_network

  # ====== Redis ====== #
  redis:
    image: redis:6-alpine
    networks:
      - data_network

  # ====== Backend ====== #
  backend:
    build:
      context: .
      dockerfile: backend/dockerfiles/dev/Dockerfile
    container_name: printoo_backend
    command: python manage.py runserver 0.0.0.0:9010
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    ports:
      - "9010:9010"
    env_file:
      - ./env/.env.dev
    depends_on:
      - db
      - redis
    networks:
      - backend_network
      - data_network

  # ====== Celery Workers ====== #
  celery_worker:
    build:
      context: .
      dockerfile: backend/dockerfiles/dev/Dockerfile
    container_name: printoo_celery
    command: celery -A backend.celery worker -l info
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    env_file:
      - ./env/.env.dev
    depends_on:
      - redis
      - db
    networks:
      - data_network

# ====== Networks' Settings ====== #
networks:
  backend_network:
    driver: bridge
  data_network:
    driver: bridge
    internal: false

# ====== Database Volume ====== #
volumes:
  postgres_data: