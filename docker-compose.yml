version: '3.8'

services:
  # ====== Database ====== #
  db:
    image: postgres:17-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./env/.env.prod
    networks:
      - data_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Redis ====== #
  redis:
    image: redis:6-alpine
    restart: always
    networks:
      - data_network

  # ====== Customer Backend (Gunicorn) ====== #
  customer_site:
    build:
      context: .
      dockerfile: backend/services/customer_site/dockerfiles/prod/Dockerfile
    container_name: printoo_customer_site
    restart: always
    volumes:
      - ./backend/services/customer_site/media:/app/src/media
      - staticfiles_data:/app/src/staticfiles
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app/shared_libs:$PYTHONPATH
      - DJANGO_SETTINGS_MODULE=customer_site.settings.production
    env_file:
      - ./env/.env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - customer_site_network
      - data_network

  # ====== Celery Worker ====== #
  celery_worker_customer:
    build:
      context: .
      dockerfile: backend/services/customer_site/dockerfiles/prod/Dockerfile
    container_name: printoo_celery_customer
    restart: always
    command: celery -A customer_site.celery worker -l info --concurrency=2
    volumes:
      - ./backend/services/customer_site/media:/app/src/media
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app/shared_libs:$PYTHONPATH
      - DJANGO_SETTINGS_MODULE=customer_site.settings.production
    env_file:
      - ./env/.env.prod
    depends_on:
      - redis
      - db
    networks:
      - data_network

  # ====== React Frontend ====== #
  frontend:
    build:
      context: ./frontend/react-js
      dockerfile: Dockerfile.prod
    container_name: printoo_frontend
    restart: always
    networks:
      - customer_site_network

  # ====== Nginx ====== #
  nginx:
    image: nginx:alpine
    container_name: printoo_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - staticfiles_data:/app/src/staticfiles:ro
      - ./backend/services/customer_site/media:/app/src/media:ro
    depends_on:
      - customer_site
      - frontend
    networks:
      - customer_site_network

networks:
  customer_site_network:
    driver: bridge
  data_network:
    driver: bridge

volumes:
  postgres_data:
  staticfiles_data: