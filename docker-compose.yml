version: '3.8'

services:
  # ====== Database ====== #
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    env_file:
      - ./env/.env.dev
    networks:
      - data_network

  # ====== Redis ====== #
  redis:
    image: redis:6-alpine
    networks:
      - data_network

# --- شروع بخش‌های غیرفعال شده ---

  # # ====== Admin Backend (غیرفعال شد) ====== #
  admin_site:
    build:
      context: .
      dockerfile: backend/services/admin_site/dockerfiles/dev/Dockerfile
    container_name: printoo_admin_site
    command: python manage.py runserver 0.0.0.0:8010
    volumes:
      - ./backend/services/admin_site:/app/src
      - ./backend/shared_libs:/app/shared_libs
    ports:
      - "8010:8010"
    environment:
      - PYTHONPATH=/app/shared_libs:$PYTHONPATH
    env_file:
      - ./env/.env.dev
    depends_on:
      - db
      - redis
    networks:
      - admin_site_network
      - data_network

  # # ====== Celery Workers(Admin Site) (غیرفعال شد) ====== #
  celery_worker_admin:
    build:
      context: .
      dockerfile: backend/services/admin_site/dockerfiles/dev/Dockerfile
    container_name: printoo_celery_admin
    command: celery -A admin_site.celery worker -l info
    volumes:
      - ./backend/services/admin_site:/app/src
      - ./backend/shared_libs:/app/shared_libs
    environment:
      - PYTHONPATH=/app/shared_libs:$PYTHONPATH
    env_file:
      - ./env/.env.dev
    depends_on:
      - redis
      - db
    networks:
      - data_network

# --- پایان بخش‌های غیرفعال شده ---

  # ====== Customer Backend ====== #
  customer_site:
    build:
      context: .
      dockerfile: backend/services/customer_site/dockerfiles/dev/Dockerfile
    container_name: printoo_customer_site
    command: python manage.py runserver 0.0.0.0:9010
    volumes:
      - ./backend/services/customer_site:/app/src
      - ./backend/shared_libs:/app/shared_libs
      - ./backend/services/customer_site/media:/app/media
    ports:
      - "9010:9010"
    environment:
      - PYTHONPATH=/app/shared_libs:$PYTHONPATH
    env_file:
      - ./env/.env.dev
    depends_on:
      - db
      - redis
    networks:
      - customer_site_network
      - data_network

  # ====== Celery Workers(Customer Site) ====== #
  celery_worker_customer:
    build:
      context: .
      dockerfile: backend/services/customer_site/dockerfiles/dev/Dockerfile
    container_name: printoo_celery_customer
    command: celery -A customer_site.celery worker -l info
    volumes:
      - ./backend/services/customer_site:/app/src
      - ./backend/shared_libs:/app/shared_libs
      - ./backend/services/customer_site/media:/app/media
    environment:
      - PYTHONPATH=/app/shared_libs:$PYTHONPATH
    env_file:
      - ./env/.env.dev
    depends_on:
      - redis
      - db
    networks:
      - data_network

# ====== Frontend (React) ====== #
  frontend:
    build:
      context: ./frontend/react-js
      dockerfile: Dockerfile
    container_name: printoo_frontend
    ports:
     - "5173:5173"
    
    # === نکته مهم: وقتی هاست مود هست، نتورک‌ها رو پاک می‌کنیم ===
    # network_mode: "host"
    volumes:
      - ./frontend/react-js:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - customer_site
    networks: 
      - customer_site_network

# ====== Networks' Settings ====== #
# === نکته مهم: این بخش باید حتماً فعال باشه (کامنت نباشه) ===
networks:
  admin_site_network:
    driver: bridge
  customer_site_network:
    driver: bridge
  data_network:
    driver: bridge
    internal: false

# ====== Database Volume ====== #
volumes:
  postgres_data: