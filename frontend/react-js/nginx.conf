# ۱. هدایت ترافیک HTTP به HTTPS (به جز مسیر چالش Certbot)
server {
    listen 80;
    server_name printoo24.com www.printoo24.com;
    
    # مسیر مخصوص برای اعتبارسنجی Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # بقیه درخواست‌ها برن روی HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ۲. پیکربندی اصلی HTTPS
server {
    listen 443 ssl;
    server_name printoo24.com www.printoo24.com;

    # اینجا رو فعلا دست نزنید تا گواهینامه جدید رو بگیریم
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;


    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;
    root /usr/share/nginx/html;
    index index.html;

    # --- تنظیمات مدیا و استاتیک ---
    location /media/ {
        alias /app/src/media/;
        expires 30d;
    }

    location /static/ {
        alias /app/src/staticfiles/;
        expires 30d;
    }

    # --- تنظیمات API ---
    location /api/v1/ {
        proxy_pass http://customer_site:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- تنظیمات ریکت ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}