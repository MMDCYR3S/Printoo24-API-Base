# nginx.conf

server {
    listen 80;
    server_name printoo24.com www.printoo24.com;

    # --- تنظیمات مدیا و استاتیک ---
    location /media/ {
        alias /app/src/media/;
        expires 30d;
    }

    location /static/ {
        alias /app/src/staticfiles/;
        expires 30d;
    }

    # --- تنظیمات API ---
    location /api/v1/ {
        proxy_pass http://customer_site:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # این هدر بسیار مهم است. آروان‌کلود پروتکل اصلی (https) را در این هدر می‌ریزد 
        # و ما آن را به جنگو پاس می‌دهیم تا بفهمد درخواست امن بوده است.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # --- تنظیمات ریکت ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}