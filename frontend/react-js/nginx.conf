server {
    listen 80;
    server_name printoo24.com www.printoo24.com;

    root /usr/share/nginx/html;
    index index.html;

    # ۱. اصلاح اصلی: سرو کردن مدیا مستقیماً توسط Nginx
    location /media/ {
        # این آدرس باید دقیقا همان مسیری باشد که در Docker Volume ست کرده‌ای
        alias /app/media/; 
        autoindex off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ۲. سرو کردن استاتیک‌ فایل‌های جنگو (مثل پنل ادمین)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ۳. پروکسی برای API ها و پنل ادمین
    location ~ ^/(api|admin)/ {
        proxy_pass http://customer_site:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ۴. مسیر پیش‌فرض فرانت‌ند
    location / {
        try_files $uri $uri/ /index.html;
    }
}