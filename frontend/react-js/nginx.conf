# ۱. هدایت ترافیک HTTP به HTTPS (بدون تغییر)
server {
    listen 80;
    server_name printoo24.com www.printoo24.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ۲. پیکربندی اصلی HTTPS (با اعمال تغییرات)
server {
    listen 443 ssl;
    server_name printoo24.com www.printoo24.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ===== تنظیمات آپلود فایل =====
    # این خط مشکل "too long" و محدودیت 1 مگابایت را حل می‌کند
    client_max_body_size 20M; 

    root /usr/share/nginx/html;
    index index.html;

    # --- تنظیمات مدیا و استاتیک ---
    location /media/ {
        alias /app/src/media/;
        expires 30d;
    }

    location /static/ {
        alias /app/src/staticfiles/;
        expires 30d;
    }

    # --- تنظیمات API ---
    location /api/v1/ {
        proxy_pass http://customer_site:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # نکته اضافی: افزایش تایم‌اوت برای آپلود‌های سنگین (اختیاری)
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # --- تنظیمات ریکت ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}