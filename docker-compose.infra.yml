services:
  # ====== Database ====== #
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    env_file:
      - ./env/.env.dev
    networks:
      - data_network
    # ===== تنظیمات سلامت کانتینر ===== #
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ====== Redis ====== #
  redis:
    image: redis:6-alpine
    networks:
      - data_network

# ====== Networks Configuration ====== #
networks:
  data_network:
    driver: bridge
    # ===== نام ثابت برای دسترسی خارجی ===== #
    name: printoo_shared_data_network

volumes:
  postgres_data:
