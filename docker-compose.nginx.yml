version: '3.8'

services:
  nginx_proxy:
    image: nginx:stable-alpine
    container_name: printoo_nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - customer_net
    restart: always
    depends_on:
      - frontend
      - customer_site

networks:
  customer_net:
    external: false