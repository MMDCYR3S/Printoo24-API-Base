version: '3.8'

services:
  # ====== Customer Backend (Production) ====== #
  customer_site:
    build:
      context: .
      dockerfile: backend/services/customer_site/dockerfiles/prod/Dockerfile
    container_name: printoo_customer_site
    volumes:
      - customer_media:/app/src/media
      - customer_static:/app/src/staticfiles
    ports:
      - "9010:9010"
    environment:
      - PYTHONPATH=/app/shared_libs:$PYTHONPATH
      - DJANGO_SETTINGS_MODULE=customer_site.settings.production
    env_file:
      - ./env/.env.prod
    networks:
      - shared_data_net
      - customer_net
    restart: always

  # ====== Celery Workers ====== #
  celery_worker_customer:
    build:
      context: .
      dockerfile: backend/services/customer_site/dockerfiles/prod/Dockerfile
    container_name: printoo_celery_customer
    command: celery -A customer_site.celery worker -l info
    volumes:
      - customer_media:/app/src/media
    environment:
      - PYTHONPATH=/app/shared_libs:$PYTHONPATH
      - DJANGO_SETTINGS_MODULE=customer_site.settings.production
    env_file:
      - ./env/.env.prod
    networks:
      - shared_data_net
    restart: always

  # ====== Frontend (Nginx) ====== #
  frontend:
    build: 
      context: ./frontend/react-js
      dockerfile: Dockerfile.prod
    container_name: printoo_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/react-js/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - customer_static:/app/src/staticfiles
      - customer_media:/app/src/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks: 
      - customer_net
    depends_on:
      - customer_site
    restart: always

networks:
  customer_net:
    driver: bridge
  shared_data_net:
    external: true
    name: printoo_shared_data_network

volumes:
  customer_media:
  customer_static: